<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportArena — Book Your Game</title>

  <meta name="description" content="SportArena - Find and book sports arenas near you." />

  <!-- Fonts: Barlow Condensed (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" />

  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <!-- Leaflet Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Default (Dark Theme) */
      --bg:        #080A0D;
      --surface:   #0F1218;
      --surface2:  #161B24;
      --surface3:  #1E2530;
      --border:    #232B38;
      --border2:   #2D3748;
      --text:      #F2F5FA;
      --text2:     #A8B5C8;
      --text3:     #5A6880;

      --accent:    #E8371A;
      --accent2:   #FF5A3C;
      --gold:      #F5A623;
      --gold2:     #FFB940;
      --green:     #1DB954;

      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'DM Sans', sans-serif;

      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 16px;
      --r-xl: 22px;

      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --glass-bg: rgba(15, 18, 24, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.4);
    }

    [data-theme="light"] {
      --bg:        #F8F9FB;
      --surface:   #FFFFFF;
      --surface2:  #F1F3F7;
      --surface3:  #E8ECF2;
      --border:    #E2E8F0;
      --border2:   #CBD5E0;
      --text:      #1A202C;
      --text2:     #4A5568;
      --text3:     #718096;

      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.06);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Focus */
    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- ANIMATIONS ---------- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideRight {
      from { opacity: 0; transform: translateX(-24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes marque {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes shimmer {
      from { background-position: -600px 0; }
      to   { background-position: 600px 0; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes borderPulse {
      0%,100% { border-color: var(--accent); }
      50%     { border-color: transparent; }
    }

    .anim-fadeUp   { animation: fadeUp  0.5s ease-out both; }
    .anim-fadeIn   { animation: fadeIn  0.4s ease-out both; }
    .anim-scaleIn  { animation: scaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
    .anim-slideDown{ animation: slideDown 0.4s ease-out both; }

    /* Glassmorphism */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-lg);
    }

    /* Premium Micro-animations */
    .hover-scale { transition: transform var(--transition); }
    .hover-scale:hover { transform: scale(1.03); }

    .hover-lift { transition: all var(--transition); }
    .hover-lift:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }

    .hover-glow { transition: all var(--transition); }
    .hover-glow:hover { box-shadow: 0 0 20px rgba(232, 55, 26, 0.3); border-color: var(--accent); }

    .img-zoom-wrap { overflow: hidden; border-radius: inherit; }
    .img-zoom-wrap img { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .img-zoom-wrap:hover img { transform: scale(1.1); }

    /* Theme Toggle Button */
    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: rotate(15deg); }

    /* Stagger helpers */
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.1s; }
    .d3 { animation-delay: 0.15s; }
    .d4 { animation-delay: 0.2s; }
    .d5 { animation-delay: 0.25s; }
    .d6 { animation-delay: 0.3s; }

    /* ---------- NAVBAR ---------- */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,10,13,0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      height: 60px;
      display: flex;
      align-items: center;
    }
    .navbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      border: none;
      background: none;
    }
    .logo-mark {
      width: 34px;
      height: 34px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 15% 100%, 0 85%);
    }
    .logo-mark svg { width: 18px; height: 18px; fill: white; }
    .logo-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.02em;
      color: var(--text);
      text-transform: uppercase;
    }
    .logo-text span { color: var(--accent); }

    .nav-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
    }

    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 14px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      transition: color var(--transition);
      letter-spacing: 0.01em;
      border-radius: var(--r-sm);
      position: relative;
    }
    .nav-link:hover { color: var(--text); }
    .nav-link.active {
      color: var(--accent);
      background: rgba(232,55,26,0.08);
    }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 14px;
      right: 14px;
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
    }

    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 4px 4px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
    }
    .nav-avatar {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 13px;
      color: white;
    }
    .nav-name { font-size: 13px; font-weight: 500; color: var(--text); }

    .btn-ghost {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 14px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      transition: color var(--transition);
      border-radius: var(--r-sm);
    }
    .btn-ghost:hover { color: var(--text); background: var(--surface2); }

    .btn-primary {
      background: var(--accent);
      border: none;
      cursor: pointer;
      padding: 8px 20px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: white;
      border-radius: var(--r-sm);
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      white-space: nowrap;
    }
    .btn-primary:hover {
      background: var(--accent2);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(232,55,26,0.35);
    }
    .btn-primary:disabled { opacity: 0.45; pointer-events: none; }

    .btn-outline {
      background: none;
      border: 1px solid var(--border2);
      cursor: pointer;
      padding: 8px 20px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
      border-radius: var(--r-sm);
      transition: all var(--transition);
      white-space: nowrap;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: rgba(232,55,26,0.05); }

    .btn-sm {
      padding: 5px 12px;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    /* Mobile nav */
    .mobile-menu-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
    }
    .hamburger-line {
      width: 16px;
      height: 2px;
      background: var(--text);
      border-radius: 1px;
      transition: var(--transition);
    }

    .mobile-menu {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mobile-nav-link {
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 12px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
      text-align: left;
      border-radius: var(--r-md);
      transition: all var(--transition);
    }
    .mobile-nav-link:hover { color: var(--text); background: var(--surface2); }

    /* ---------- TICKER ---------- */
    .ticker {
      background: var(--accent);
      overflow: hidden;
      height: 34px;
      display: flex;
      align-items: center;
    }
    .ticker-label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: white;
      background: rgba(0,0,0,0.2);
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .ticker-track {
      display: flex;
      animation: marque 28s linear infinite;
      white-space: nowrap;
    }
    .ticker-item {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
      padding: 0 32px;
    }
    .ticker-dot {
      color: rgba(255,255,255,0.4);
      padding: 0 4px;
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative;
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      filter: brightness(0.3);
    }
    .hero-bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        175deg,
        rgba(8,10,13,0.1) 0%,
        rgba(8,10,13,0.5) 40%,
        rgba(8,10,13,0.92) 75%,
        var(--bg) 100%
      );
    }
    .hero-noise {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.5;
    }

    /* Red line accent */
    .hero-line {
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      z-index: 2;
    }

    /* Grid lines */
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 80px;
      width: 100%;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(232,55,26,0.4);
      background: rgba(232,55,26,0.08);
      padding: 5px 12px;
      border-radius: 2px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 28px;
    }
    .hero-tag-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .hero-headline {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(64px, 10vw, 128px);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 28px;
    }
    .hero-headline em {
      font-style: italic;
      color: var(--accent);
      display: block;
    }

    .hero-sub {
      font-size: 16px;
      font-weight: 400;
      color: var(--text2);
      max-width: 480px;
      line-height: 1.65;
      margin-bottom: 40px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .hero-actions .btn-primary { font-size: 15px; padding: 12px 30px; }
    .hero-actions .btn-outline { font-size: 15px; padding: 12px 30px; }

    .hero-stats {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-top: 60px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }
    .hero-stat-val {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 32px;
      color: var(--text);
      line-height: 1;
    }
    .hero-stat-val span { color: var(--accent); }
    .hero-stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }
    .hero-stat-divider {
      width: 1px;
      height: 36px;
      background: var(--border);
    }

    /* ---------- SPORT CHIPS ---------- */
    .sport-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sport-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 7px 14px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text2);
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sport-chip:hover { border-color: var(--border2); color: var(--text); background: var(--surface3); }
    .sport-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 20px rgba(232,55,26,0.3);
    }
    .sport-chip-icon { font-size: 14px; }

    /* ---------- FILTER BAR ---------- */
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 20px 24px;
      margin-bottom: 32px;
    }
    .filter-bar-top {
      display: grid;
      grid-template-columns: 1fr 1fr 140px 140px;
      gap: 12px;
      margin-bottom: 16px;
    }
    .filter-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }
    .filter-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 9px 12px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text);
      transition: border-color var(--transition);
    }
    .filter-input::placeholder { color: var(--text3); }
    .filter-input:focus { outline: none; border-color: var(--accent); }
    .filter-select {
      appearance: none;
      cursor: pointer;
    }
    .filter-divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 16px;
    }

    /* ---------- SECTION ---------- */
    .page-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .section-pad { padding: 48px 0; }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }
    .section-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 38px;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1;
    }
    .section-title span { color: var(--accent); }
    .section-subtitle {
      font-size: 13px;
      color: var(--text3);
      margin-top: 6px;
      font-weight: 400;
    }

    /* ---------- ARENA GRID ---------- */
    .arena-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .arena-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .arena-card:hover {
      border-color: var(--border2);
      transform: translateY(-4px);
      box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 0 1px var(--border2);
    }

    .arena-card-img-wrap {
      position: relative;
      height: 200px;
      overflow: hidden;
    }
    .arena-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      filter: brightness(0.85);
    }
    .arena-card:hover .arena-card-img { transform: scale(1.06); }

    .arena-card-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,18,24,0.95) 0%, transparent 50%);
    }

    .arena-card-sport {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(8,10,13,0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
    }

    .arena-card-price {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--accent);
      padding: 4px 10px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 800;
      color: white;
    }

    .arena-card-body { padding: 20px; }

    .arena-card-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .arena-card-loc {
      font-size: 12px;
      color: var(--text3);
      font-weight: 500;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 10px;
    }
    .loc-dot {
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .arena-card-desc {
      font-size: 12px;
      color: var(--text3);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .arena-card-footer {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .card-btn-contact {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 9px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text2);
      transition: all var(--transition);
      text-decoration: none;
      text-align: center;
    }
    .card-btn-contact:hover { border-color: var(--border2); color: var(--text); }

    .card-btn-book {
      flex: 2;
      background: var(--accent);
      border: none;
      cursor: pointer;
      padding: 9px 16px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      transition: all var(--transition);
    }
    .card-btn-book:hover { background: var(--accent2); box-shadow: 0 4px 16px rgba(232,55,26,0.4); }

    /* ---------- PAGE HEADER BAND ---------- */
    .page-band {
      border-bottom: 1px solid var(--border);
      padding: 32px 0 0;
      margin-bottom: 32px;
    }
    .page-band-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 24px;
    }
    .page-band-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .page-band-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 48px;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 0.95;
    }
    .page-band-sub {
      font-size: 13px;
      color: var(--text3);
      margin-top: 8px;
    }

    /* ---------- DETAIL PAGE ---------- */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 28px;
      align-items: start;
    }

    .detail-hero {
      border-radius: var(--r-lg);
      overflow: hidden;
      height: 380px;
      position: relative;
    }
    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7);
    }
    .detail-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8,10,13,0.9) 0%, transparent 60%);
    }
    .detail-hero-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px;
    }
    .detail-sport-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      margin-bottom: 10px;
    }
    .detail-arena-name {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 44px;
      text-transform: uppercase;
      color: white;
      line-height: 0.95;
    }
    .detail-arena-loc {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .detail-section-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .detail-section-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
    }
    .detail-section-body { padding: 22px; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .info-tile {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px;
    }
    .info-tile-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }
    .info-tile-val {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
    }
    .info-tile-val.accent { color: var(--gold); }

    /* Slots */
    .slots-date-label {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .slot-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 10px 6px;
      border-radius: var(--r-sm);
      text-align: center;
      transition: all var(--transition);
    }
    .slot-btn:hover { border-color: var(--border2); background: var(--surface3); }
    .slot-btn.selected {
      background: rgba(232,55,26,0.12);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }
    .slot-time {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .slot-btn.selected .slot-time { color: var(--accent); }

    /* Booking Card */
    .booking-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      position: sticky;
      top: 76px;
    }
    .booking-card-header {
      background: var(--accent);
      padding: 20px 22px;
    }
    .booking-card-header-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .booking-price-big {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 40px;
      color: white;
      line-height: 1;
    }
    .booking-price-sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }

    .booking-card-body { padding: 22px; }

    .booking-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .booking-row:last-of-type { border-bottom: none; }
    .booking-row-label {
      font-size: 12px;
      color: var(--text3);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .booking-row-val {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }

    .slot-selected-box {
      background: rgba(232,55,26,0.08);
      border: 1px solid rgba(232,55,26,0.2);
      border-radius: var(--r-sm);
      padding: 12px 14px;
      margin: 16px 0;
    }
    .slot-selected-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .slot-selected-date {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }
    .slot-selected-time { font-size: 12px; color: var(--text2); margin-top: 2px; }

    .book-cta {
      width: 100%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      padding: 14px;
      border-radius: var(--r-md);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      margin-top: 20px;
      transition: all var(--transition);
    }
    .book-cta:hover { background: var(--accent2); box-shadow: 0 8px 24px rgba(232,55,26,0.4); }
    .book-cta:disabled { opacity: 0.3; cursor: not-allowed; }
    .book-cta-inactive {
      background: var(--surface2);
      color: var(--text3);
      box-shadow: none;
    }
    .book-cta-inactive:hover { background: var(--surface2); box-shadow: none; }

    /* ---------- AUTH PAGES ---------- */
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }
    .auth-bg-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,55,26,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,55,26,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .auth-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      overflow: hidden;
    }
    .auth-card-stripe {
      height: 4px;
      background: var(--accent);
    }
    .auth-card-body { padding: 40px; }

    .auth-eyebrow {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .auth-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 40px;
      text-transform: uppercase;
      color: var(--text);
      line-height: 0.95;
      margin-bottom: 6px;
    }
    .auth-sub { font-size: 13px; color: var(--text3); margin-bottom: 32px; }

    .form-group { margin-bottom: 18px; }
    .form-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 7px;
      display: block;
    }
    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 11px 14px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-input::placeholder { color: var(--text3); }
    .form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,55,26,0.12); }

    .form-select { appearance: none; cursor: pointer; }

    .role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .role-option {
      border: 2px solid var(--border);
      background: var(--surface2);
      border-radius: var(--r-md);
      padding: 16px 14px;
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
    }
    .role-option:hover { border-color: var(--border2); }
    .role-option.active { border-color: var(--accent); background: rgba(232,55,26,0.06); }
    .role-option-icon { font-size: 20px; margin-bottom: 8px; }
    .role-option-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      text-transform: uppercase;
      color: var(--text);
    }
    .role-option.active .role-option-title { color: var(--accent); }
    .role-option-desc { font-size: 11px; color: var(--text3); margin-top: 3px; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
    }
    .auth-divider-line { flex: 1; height: 1px; background: var(--border); }
    .auth-divider-text { font-size: 11px; color: var(--text3); white-space: nowrap; }

    .auth-switch { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text3); }
    .auth-switch-link {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      font-family: var(--font-body);
    }
    .auth-switch-link:hover { text-decoration: underline; }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      padding: 13px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      transition: all var(--transition);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover { background: var(--accent2); box-shadow: 0 8px 24px rgba(232,55,26,0.35); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------- SPINNER ---------- */
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 80px 0; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ---------- EMPTY STATE ---------- */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
    }
    .empty-icon {
      width: 72px;
      height: 72px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .empty-icon svg { width: 32px; height: 32px; stroke: var(--text3); fill: none; stroke-width: 1.5; }
    .empty-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 8px;
    }
    .empty-desc { font-size: 13px; color: var(--text3); max-width: 360px; margin: 0 auto 24px; line-height: 1.6; }

    /* ---------- MODAL ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      animation: fadeIn 0.2s ease-out;
    }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-xl);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      animation: scaleIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-box.lg { max-width: 680px; }

    .modal-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      text-transform: uppercase;
      color: var(--text);
    }
    .modal-close {
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      font-size: 18px;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .modal-close:hover { color: var(--text); background: var(--surface3); }
    .modal-body { padding: 24px; }

    /* ---------- PAYMENT ---------- */
    .payment-amount-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .payment-amount-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
    .payment-amount-val {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 48px;
      color: var(--text);
      line-height: 1.1;
    }
    .payment-amount-sub { font-size: 12px; color: var(--text3); }

    .payment-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
    .payment-method-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 14px 8px;
      border-radius: var(--r-md);
      text-align: center;
      transition: all var(--transition);
    }
    .payment-method-btn:hover { border-color: var(--border2); }
    .payment-method-btn.active {
      border-color: var(--accent);
      background: rgba(232,55,26,0.07);
    }
    .payment-method-icon { font-size: 22px; display: block; margin-bottom: 6px; }
    .payment-method-label {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text2);
    }
    .payment-method-btn.active .payment-method-label { color: var(--accent); }

    .pay-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      padding: 14px;
      border-radius: var(--r-md);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      margin-top: 8px;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .pay-btn:hover { background: var(--accent2); box-shadow: 0 8px 24px rgba(232,55,26,0.4); }
    .pay-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pay-disclaimer { text-align: center; font-size: 11px; color: var(--text3); margin-top: 10px; line-height: 1.5; }

    /* Booking result */
    .result-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .result-icon-success { background: rgba(29,185,84,0.1); border: 1px solid rgba(29,185,84,0.3); }
    .result-icon-fail { background: rgba(232,55,26,0.1); border: 1px solid rgba(232,55,26,0.3); }

    /* ---------- DASHBOARD ---------- */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .stat-card-accent-line {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
    }
    .stat-card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
    }
    .stat-card-val {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 40px;
      color: var(--text);
      line-height: 1;
    }

    /* Table */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table thead tr {
      border-bottom: 1px solid var(--border);
    }
    .data-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text3);
    }
    .data-table td {
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: var(--surface2); }

    /* ---------- STATUS BADGES ---------- */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge-green { background: rgba(29,185,84,0.1); color: var(--green); border: 1px solid rgba(29,185,84,0.2); }
    .badge-amber { background: rgba(245,166,35,0.1); color: var(--gold); border: 1px solid rgba(245,166,35,0.2); }
    .badge-red   { background: rgba(232,55,26,0.1); color: var(--accent2); border: 1px solid rgba(232,55,26,0.2); }
    .badge-gray  { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }

    /* ---------- MY ARENAS ---------- */
    .arena-manage-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .arena-manage-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .arena-manage-img {
      height: 150px;
      overflow: hidden;
      position: relative;
    }
    .arena-manage-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7);
    }
    .arena-manage-body { padding: 16px; }
    .arena-manage-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 18px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 4px;
    }
    .arena-manage-meta { font-size: 12px; color: var(--text3); margin-bottom: 14px; }
    .arena-manage-actions { display: flex; gap: 8px; }

    .action-btn {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text2);
      transition: all var(--transition);
    }
    .action-btn:hover { border-color: var(--border2); color: var(--text); }
    .action-btn.danger:hover { border-color: var(--accent); color: var(--accent); }

    /* ---------- BOOKINGS PAGE ---------- */
    .booking-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 20px;
      display: flex;
      gap: 18px;
      align-items: center;
      transition: border-color var(--transition);
    }
    .booking-item:hover { border-color: var(--border2); }
    .booking-item-img {
      width: 80px;
      height: 80px;
      border-radius: var(--r-md);
      object-fit: cover;
      flex-shrink: 0;
      filter: brightness(0.8);
    }
    .booking-item-info { flex: 1; min-width: 0; }
    .booking-item-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 20px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 4px;
    }
    .booking-item-meta { font-size: 12px; color: var(--text3); }
    .booking-item-right { text-align: right; flex-shrink: 0; }
    .booking-item-amount {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 24px;
      color: var(--text);
      margin-bottom: 6px;
    }

    /* ---------- SLOTS MANAGE ---------- */
    .slot-manage-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slot-manage-date {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }
    .slot-manage-time { font-size: 12px; color: var(--text3); margin-top: 2px; }

    /* ---------- FOOTER ---------- */
    .footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      margin-top: 80px;
    }
    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .footer-copy {
      font-size: 12px;
      color: var(--text3);
    }
    .footer-right { display: flex; align-items: center; gap: 20px; }
    .footer-link { font-size: 12px; color: var(--text3); text-decoration: none; cursor: pointer; }
    .footer-link:hover { color: var(--text2); }

    /* ---------- BACK BUTTON ---------- */
    .back-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 7px 14px;
      border-radius: var(--r-sm);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text2);
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { border-color: var(--border2); color: var(--text); }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 1024px) {
      .arena-grid { grid-template-columns: repeat(2, 1fr); }
      .arena-manage-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: 1fr; }
      .filter-bar-top { grid-template-columns: 1fr 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .arena-grid { grid-template-columns: 1fr; }
      .arena-manage-grid { grid-template-columns: 1fr; }
      .filter-bar-top { grid-template-columns: 1fr; }
      .slots-grid { grid-template-columns: repeat(3, 1fr); }
      .hero-headline { font-size: 56px; }
      .stats-grid { grid-template-columns: 1fr; }
      .payment-methods { grid-template-columns: repeat(3, 1fr); }
      .navbar-inner { gap: 16px; }
      .nav-links { display: none; }
      .booking-item { flex-direction: column; align-items: flex-start; }
      .booking-item-right { text-align: left; }
    }

    .desktop-only { display: flex; }
    @media (max-width: 640px) { .desktop-only { display: none; } }
    .mobile-only { display: none; }
    @media (max-width: 640px) { .mobile-only { display: flex; } }

    /* Shimmer skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: var(--r-sm);
    }

    /* Slot list scroll */
    .slot-scroll { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    /* Create arena form grid */
    .create-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 560px) { .create-grid { grid-template-columns: 1fr; } }

    textarea.form-input { resize: vertical; min-height: 80px; font-family: var(--font-body); }
  </style>
</head>
<body>
  <div id="error-box" style="display:none; padding: 20px; background: red; color: white; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; font-size: 16px; white-space: pre-wrap; max-height: 50vh; overflow: auto;"></div>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('error-box').innerText += 'ERROR: ' + message + '\n' + (error ? error.stack : '') + '\n\n';
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('error-box').innerText += 'PROMISE REJECTION: ' + event.reason + '\n\n';
    });
  </script>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, createContext, useContext } = React;

    const API = 'http://localhost:5000';

    const SPORTS = [
      { value: 'football',   label: 'Football',   icon: null },
      { value: 'cricket',    label: 'Cricket',    icon: null },
      { value: 'badminton',  label: 'Badminton',  icon: null },
      { value: 'basketball', label: 'Basketball', icon: null },
      { value: 'tennis',     label: 'Tennis',     icon: null },
      { value: 'volleyball', label: 'Volleyball', icon: null },
      { value: 'swimming',   label: 'Swimming',   icon: null },
      { value: 'boxing',     label: 'Boxing',     icon: null },
    ];

    const SPORT_IMAGES = {
      football:   'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=900&q=80',
      cricket:    'https://images.unsplash.com/photo-1531415074968-036ba1b575da?w=900&q=80',
      badminton:  'https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?w=900&q=80',
      basketball: 'https://images.unsplash.com/photo-1546519638-68e109498ffc?w=900&q=80',
      tennis:     'https://images.unsplash.com/photo-1554068865-24cecd4e34b8?w=900&q=80',
      volleyball: 'https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=900&q=80',
      swimming:   'https://images.unsplash.com/photo-1576610616656-d3aa5d1f4534?w=900&q=80',
      boxing:     'https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=900&q=80',
    };

    /* ============================
       API Helper
    ============================ */
    const api = {
      headers: (auth = true) => {
        const h = { 'Content-Type': 'application/json' };
        if (auth) { const t = localStorage.getItem('sa_token'); if (t) h['Authorization'] = `Bearer ${t}`; }
        return h;
      },
      get: async (path, auth = false) => {
        const r = await fetch(`${API}${path}`, { headers: api.headers(auth) });
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Request failed'); }
        return r.json();
      },
      post: async (path, body, auth = true) => {
        const r = await fetch(`${API}${path}`, { method: 'POST', headers: api.headers(auth), body: JSON.stringify(body) });
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Request failed'); }
        return r.json();
      },
      put: async (path, body) => {
        const r = await fetch(`${API}${path}`, { method: 'PUT', headers: api.headers(true), body: JSON.stringify(body) });
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Request failed'); }
        return r.json();
      },
      delete: async (path) => {
        const r = await fetch(`${API}${path}`, { method: 'DELETE', headers: api.headers(true) });
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Request failed'); }
        return r.json();
      },
    };

    /* ============================
       Auth
    ============================ */
    const AuthContext = createContext(null);
    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('sa_token'));
      const [loading, setLoading] = useState(true);
      const [socket, setSocket] = useState(null);

      useEffect(() => {
        let cleanup = () => {};
        if (token) {
          try {
            const p = JSON.parse(atob(token.split('.')[1]));
            setUser({ id: p.id, name: p.name, email: p.email, role: p.role });
            const s = io(API);
            setSocket(s);
            s.on('connect', () => s.emit('join_user', p.id));
            cleanup = () => s.disconnect();
          } catch { localStorage.removeItem('sa_token'); setToken(null); }
        } else {
          setSocket(null);
        }
        setLoading(false);
        return cleanup;
      }, [token]);

      const login = (u, t) => { localStorage.setItem('sa_token', t); setToken(t); setUser(u); };
      const logout = () => { localStorage.removeItem('sa_token'); setToken(null); setUser(null); };
      return <AuthContext.Provider value={{ user, token, loading, socket, login, logout }}>{children}</AuthContext.Provider>;
    }
    const useAuth = () => useContext(AuthContext);

    /* ============================
       Theme
    ============================ */
    const ThemeContext = createContext(null);
    function ThemeProvider({ children }) {
      const [theme, setTheme] = useState(localStorage.getItem('sa_theme') || 'dark');
      const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        localStorage.setItem('sa_theme', next);
      };
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);
      return <ThemeContext.Provider value={{ theme, toggleTheme }}>{children}</ThemeContext.Provider>;
    }
    const useTheme = () => useContext(ThemeContext);

    /* ============================
       Toast
    ============================ */
    function Toast({ message, type, onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 4200); return () => clearTimeout(t); }, []);
      const colors = { success: '#1DB954', error: '#E8371A', info: '#3b82f6' };
      const labels = { success: 'SUCCESS', error: 'ERROR', info: 'INFO' };
      return (
        <div style={{
          position: 'fixed', top: 76, right: 20, zIndex: 9999,
          background: 'var(--surface)',
          border: `1px solid ${colors[type] || colors.info}`,
          borderLeft: `4px solid ${colors[type] || colors.info}`,
          borderRadius: 'var(--r-md)',
          padding: '14px 18px',
          maxWidth: 360,
          display: 'flex', alignItems: 'flex-start', gap: 12,
          animation: 'slideRight 0.35s ease-out',
          boxShadow: '0 16px 40px rgba(0,0,0,0.5)',
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: colors[type], marginBottom: 3 }}>
              {labels[type] || 'INFO'}
            </div>
            <div style={{ fontSize: 13, color: 'var(--text)', lineHeight: 1.5 }}>{message}</div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text3)', fontSize: 18, lineHeight: 1, padding: 0, marginTop: -2, flexShrink: 0 }}>×</button>
        </div>
      );
    }

    /* ============================
       Navbar
    ============================ */
    function Navbar({ currentPage, setPage }) {
      const { user, logout } = useAuth();
      const { theme, toggleTheme } = useTheme();
      const [mobileOpen, setMobileOpen] = useState(false);

      return (
        <>
          <nav className="navbar">
            <div className="navbar-inner">
              <button className="logo" onClick={() => setPage(user?.role === 'business' ? 'dashboard' : 'home')}>
                <div className="logo-mark">
                  <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <span className="logo-text">Sport<span>Arena</span></span>
              </button>

              {user && (
                <>
                  <div className="nav-divider desktop-only"></div>
                  <div className="nav-links desktop-only">
                    {user.role === 'customer' && <>
                      <button className={`nav-link ${currentPage === 'home' ? 'active' : ''}`} onClick={() => setPage('home')}>Explore</button>
                      <button className={`nav-link ${currentPage === 'my-bookings' ? 'active' : ''}`} onClick={() => setPage('my-bookings')}>My Bookings</button>
                    </>}
                    {user.role === 'business' && <>
                      <button className={`nav-link ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => setPage('dashboard')}>Dashboard</button>
                      <button className={`nav-link ${currentPage === 'my-arenas' ? 'active' : ''}`} onClick={() => setPage('my-arenas')}>My Arenas</button>
                    </>}
                    {user.role === 'admin' && <>
                      <button className={`nav-link ${currentPage === 'admin-dashboard' ? 'active' : ''}`} onClick={() => setPage('admin-dashboard')}>Super Admin Panel</button>
                    </>}
                  </div>
                </>
              )}

              <div className="nav-right">
                <button className="theme-toggle" onClick={toggleTheme} title="Toggle Theme">
                  {theme === 'dark' ? (
                    <svg style={{width:20, height:20}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.95 16.95l.707.707M7.757 7.757l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" /></svg>
                  ) : (
                    <svg style={{width:20, height:20}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                  )}
                </button>
                {user ? (
                  <div className="nav-user desktop-only">
                    <div className="nav-avatar">{user.name?.[0]?.toUpperCase()}</div>
                    <span className="nav-name">{user.name}</span>
                    <button className="btn-ghost" onClick={logout} style={{ marginLeft: 4, color: 'var(--accent)', padding: '4px 10px' }}>Logout</button>
                  </div>
                ) : (
                  <div className="desktop-only" style={{ gap: 8, display: 'flex', alignItems: 'center' }}>
                    <button className="btn-ghost" onClick={() => setPage('login')}>Log in</button>
                    <button className="btn-primary btn-sm hover-glow" onClick={() => setPage('register')}>Get Started</button>
                  </div>
                )}
                <button className="mobile-menu-btn mobile-only" onClick={() => setMobileOpen(o => !o)}>
                  <div className="hamburger-line"></div>
                  <div className="hamburger-line" style={{ width: 12 }}></div>
                  <div className="hamburger-line"></div>
                </button>
              </div>
            </div>
          </nav>

          {mobileOpen && (
            <div className="mobile-menu anim-slideDown">
              {user ? <>
                {user.role === 'customer' && <>
                  <button className="mobile-nav-link" onClick={() => { setPage('home'); setMobileOpen(false); }}>Explore Arenas</button>
                  <button className="mobile-nav-link" onClick={() => { setPage('my-bookings'); setMobileOpen(false); }}>My Bookings</button>
                </>}
                {user.role === 'business' && <>
                  <button className="mobile-nav-link" onClick={() => { setPage('dashboard'); setMobileOpen(false); }}>Dashboard</button>
                  <button className="mobile-nav-link" onClick={() => { setPage('my-arenas'); setMobileOpen(false); }}>My Arenas</button>
                </>}
                <button className="mobile-nav-link" onClick={logout} style={{ color: 'var(--accent)' }}>Logout</button>
              </> : <>
                <button className="mobile-nav-link" onClick={() => { setPage('login'); setMobileOpen(false); }}>Log In</button>
                <button className="mobile-nav-link" onClick={() => { setPage('register'); setMobileOpen(false); }} style={{ color: 'var(--accent)', fontWeight: 700 }}>Get Started</button>
              </>}
            </div>
          )}
        </>
      );
    }

    /* ============================
       Ticker
    ============================ */
    function Ticker() {
      const items = ['Football', 'Cricket', 'Badminton', 'Basketball', 'Tennis', 'Volleyball', 'Swimming', 'Boxing'];
      const repeated = [...items, ...items];
      return (
        <div className="ticker">
          <div className="ticker-label">Live Now</div>
          <div style={{ overflow: 'hidden', flex: 1 }}>
            <div className="ticker-track">
              {repeated.map((item, i) => (
                <span key={i} className="ticker-item">{item}<span className="ticker-dot">&#9679;</span></span>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ============================
       Hero Section
    ============================ */
    function HeroSection({ setPage }) {
      return (
        <div className="hero">
          <div className="hero-bg">
            <img className="hero-bg-img" src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=1600&q=80" alt="" />
            <div className="hero-bg-overlay"></div>
            <div className="hero-noise"></div>
          </div>
          <div className="hero-line"></div>
          <div className="hero-grid"></div>
          <div className="hero-content">
            <div className="hero-tag anim-fadeUp">
              <div className="hero-tag-dot"></div>
              Now Live In Your City
            </div>
            <h1 className="hero-headline anim-fadeUp d1">
              Book Your Game,<br />
              <em>Own The Arena</em>
            </h1>
            <p className="hero-sub anim-fadeUp d2">
              Discover and reserve premium sports arenas near you. Football, Cricket, Badminton — all at your fingertips, instantly confirmed.
            </p>
            <div className="hero-actions anim-fadeUp d3">
              <button className="btn-primary" onClick={() => setPage('register')} style={{ fontSize: 15, padding: '12px 30px' }}>
                Start Booking
              </button>
              <button className="btn-outline" onClick={() => setPage('register')} style={{ fontSize: 15, padding: '12px 30px' }}>
                List Your Arena
              </button>
            </div>
            <div className="hero-stats anim-fadeUp d4">
              <div>
                <div className="hero-stat-val">200<span>+</span></div>
                <div className="hero-stat-label">Arenas Listed</div>
              </div>
              <div className="hero-stat-divider"></div>
              <div>
                <div className="hero-stat-val">12<span>k</span></div>
                <div className="hero-stat-label">Games Booked</div>
              </div>
              <div className="hero-stat-divider"></div>
              <div>
                <div className="hero-stat-val">8<span>+</span></div>
                <div className="hero-stat-label">Sports Available</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================
       Login Page
    ============================ */
    function LoginPage({ setPage, showToast }) {
      const { login } = useAuth();
      const [form, setForm] = useState({ email: '', password: '' });
      const [loading, setLoading] = useState(false);
      const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true);
        try {
          const data = await api.post('/auth/login', form, false);
          login(data.user, data.token);
          showToast(`Welcome back, ${data.user.name}`, 'success');
          setPage(data.user.role === 'admin' ? 'admin-dashboard' : data.user.role === 'business' ? 'dashboard' : 'home');
        } catch (err) { showToast(err.message, 'error'); }
        setLoading(false);
      };
      return (
        <div className="auth-page">
          <div className="auth-bg-lines"></div>
          <div className="auth-card anim-scaleIn">
            <div className="auth-card-stripe"></div>
            <div className="auth-card-body">
              <div className="auth-eyebrow">SportArena</div>
              <div className="auth-title">Welcome<br />Back</div>
              <div className="auth-sub">Sign in to your account to continue</div>
              <form onSubmit={handleSubmit}>
                <div className="form-group">
                  <label className="form-label">Email Address</label>
                  <input className="form-input" type="email" placeholder="you@example.com" required value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input className="form-input" type="password" placeholder="Enter your password" required value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
                </div>
                <button type="submit" disabled={loading} className="submit-btn">
                  {loading ? <><Spin/> Signing In</> : 'Sign In'}
                </button>
              </form>
              <div className="auth-switch">
                No account?{' '}

              </div>
            </div>
          </div>
        </div>

        <div className="auth-page">

          <div className="auth-card anim-scaleIn" style={{ maxWidth: 480 }}>

            <div className="auth-card-body">
              <div className="auth-eyebrow">Create Account</div>
              <div className="auth-title">Get<br />Started</div>
              <div className="auth-sub">Join thousands booking and listing arenas</div>
              <form onSubmit={handleSubmit}>
                <div className="form-group">
                  <label className="form-label">I want to</label>
                  <div className="role-selector">
                    {[{ val: 'customer', title: 'Book Arenas', desc: 'Find & play at arenas' }, { val: 'business', title: 'List Arenas', desc: 'Manage & earn revenue' }].map(r => (

                        <div className="role-option-desc">{r.desc}</div>

                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Full Name</label>
                  <input className="form-input" type="text" placeholder="John Doe" required value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Email Address</label>
                  <input className="form-input" type="email" placeholder="you@example.com" required value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input className="form-input" type="password" placeholder="Min. 6 characters" required minLength="6" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
                </div>
                <button type="submit" disabled={loading} className="submit-btn">
                  {loading ? <><Spin/> Creating Account</> : 'Create Account'}

              </form>
              <div className="auth-switch">
                Already have an account?{' '}
                <button className="auth-switch-link" onClick={() => setPage('login')}>Sign in</button>
              </div>
            </div>
          </div>
        </div>
      );

    /* ============================
       Home / Explore
    ============================ */
    function HomePage({ setPage, setSelectedArena, showToast }) {
      const { user } = useAuth();
      const [arenas, setArenas] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filters, setFilters] = useState({ sport_type: '', min_price: '', max_price: '', location: '', date: '', start_time: '', end_time: '' });
      const [userLoc, setUserLoc] = useState(null);
      const [viewMode, setViewMode] = useState('grid'); // 'grid' or 'map'

      useEffect(() => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition((pos) => {
            setUserLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          });
        }
      }, []);

      const loadArenas = useCallback(async () => {
        setLoading(true);
        try {
          const params = new URLSearchParams();
          if (filters.sport_type) params.set('sport_type', filters.sport_type);
          if (filters.min_price) params.set('min_price', filters.min_price);
          if (filters.max_price) params.set('max_price', filters.max_price);
          if (filters.location) params.set('location', filters.location);
          if (filters.date) params.set('date', filters.date);
          if (filters.start_time) params.set('start_time', filters.start_time);
          if (filters.end_time) params.set('end_time', filters.end_time);
          if (userLoc) {
            params.set('lat', userLoc.lat);
            params.set('lng', userLoc.lng);
          }
          const qs = params.toString();
          const data = await api.get(`/arenas${qs ? '?' + qs : ''}`);
          setArenas(data);
        } catch (err) { showToast(err.message, 'error'); }
        setLoading(false);
      }, [filters]);

      useEffect(() => { loadArenas(); }, [loadArenas]);

      return (
        <div>
          {!user && <><Ticker /><HeroSection setPage={setPage} /></>}

          <div className="page-wrap section-pad">
            {user && (
              <div className="page-band" style={{ padding: 0, marginBottom: 32, borderBottom: '1px solid var(--border)', paddingBottom: 28 }}>
                <div className="filter-label" style={{ color: 'var(--accent)', marginBottom: 8 }}>Discover</div>
                <div className="section-title">Find Your <span>Arena</span></div>
                <div className="section-subtitle">Browse premium venues across all sports</div>
              </div>
            )}

            {/* Filter Bar */}
            <div className="filter-bar">
              <div className="filter-bar-top">
                <div>
                  <div className="filter-label">Location</div>
                  <input className="filter-input" type="text" placeholder="City, area..." value={filters.location} onChange={e => setFilters({...filters, location: e.target.value})} />
                </div>
                <div>
                  <div className="filter-label">Sport</div>
                  <select className="filter-input filter-select" value={filters.sport_type} onChange={e => setFilters({...filters, sport_type: e.target.value})}>
                    <option value="">All Sports</option>
                    {SPORTS.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                  </select>
                </div>
                <div>
                  <div className="filter-label">Min Price</div>
                  <input className="filter-input" type="number" placeholder="Rs. 0" value={filters.min_price} onChange={e => setFilters({...filters, min_price: e.target.value})} />
                </div>
                <div>
                  <div className="filter-label">Max Price</div>
                  <input className="filter-input" type="number" placeholder="Any" value={filters.max_price} onChange={e => setFilters({...filters, max_price: e.target.value})} />
                </div>
              </div>
              <div className="filter-divider"></div>
              <div className="sport-chips">
                <button className={`sport-chip ${!filters.sport_type ? 'active' : ''}`} onClick={() => setFilters({...filters, sport_type: ''})}>All</button>
                {SPORTS.map(s => (
                  <button key={s.value} className={`sport-chip ${filters.sport_type === s.value ? 'active' : ''}`} onClick={() => setFilters({...filters, sport_type: s.value})}>
                    {s.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Community Games Section */}
            {user?.role === 'customer' && (
              <div style={{ marginBottom: 48 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 20 }}>
                   <div>
                      <div className="filter-label" style={{ color: 'var(--accent)' }}>Join Others</div>
                      <div style={{ fontSize: 24, fontWeight: 800, fontFamily: 'var(--font-display)' }}>Community <span>Games</span></div>
                   </div>
                </div>
                <CommunityGames showToast={showToast} />
              </div>
            )}

            {/* Grid */}
            <div style={{ marginBottom: 20 }}>
               <div className="filter-label" style={{ color: 'var(--accent)' }}>Arenas</div>
               <div style={{ fontSize: 24, fontWeight: 800, fontFamily: 'var(--font-display)', marginBottom: 20 }}>Featured <span>Venues</span></div>
            </div>
            {loading ? <SpinnerFull /> : arenas.length === 0 ? (
              <EmptyState title="No Arenas Found" desc="Try adjusting your filters or check back soon for new venues." />
            ) : (
              <div className="arena-grid">
                {arenas.map((arena, i) => (
                  <ArenaCard key={arena.id} arena={arena} idx={i} onClick={() => { setSelectedArena(arena); setPage('arena-detail'); }} />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ============================
